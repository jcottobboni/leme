# Builds the Linux and Windows packages. On a v* tag it publishes a GitHub release that is also a
# signed APT repository (flat format): https://github.com/jcottobboni/leme/releases/latest/download/
# always points at the newest release, so `apt upgrade` picks up new versions on its own.
# Run it by hand (workflow_dispatch) to build and inspect the packages without publishing.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check the tag matches app/package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"
      - run: make deps engine ui licenses
      - run: cd app && npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            app/release/*.deb
            app/release/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the engine
        working-directory: engine
        run: go build -trimpath -ldflags "-s -w -X main.version=$(node -p "require('../app/package.json').version")" -o bin/leme.exe ./cmd/leme
      - name: Build the UI and the installer
        working-directory: app
        run: |
          npm ci
          npx vite build
          node ../scripts/go-licenses.mjs ../engine/bin/leme.exe ../engine/bin/THIRD_PARTY_LICENSES.txt
          npx electron-builder --win nsis --x64 --publish never
      - name: Install the package and start it (engine must come up)
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/release/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Leme'
          foreach ($f in 'Leme.exe', 'resources\engine\leme.exe', 'resources\licenses\LICENSE', 'resources\licenses\THIRD_PARTY_LICENSES-engine.txt', 'resources\renderer-dist\THIRD_PARTY_LICENSES.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $env:KUBECONFIG = "$PWD\app\e2e\fixtures\sweep-fakes.kubeconfig"
          $app = Start-Process (Join-Path $dir 'Leme.exe') -PassThru
          $engine = $null
          for ($i = 0; $i -lt 30 -and -not $engine; $i++) {
            Start-Sleep 1
            $engine = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*\resources\engine\leme.exe' }
          }
          if (-not $engine) { throw 'engine did not start' }
          "engine running: $($engine.Path)"
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/release/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: APT repository index (flat), signed
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd dist
          apt-ftparchive packages . | sed 's#^Filename: \./#Filename: #' > Packages
          gzip -9kn Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Leme -o APT::FTPArchive::Release::Label=Leme \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Description="Leme APT repository" \
            release . > Release
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --export > leme-archive-keyring.gpg
          gpg --verify InRelease
          rm -rf "$GNUPGHOME"
          sha256sum *.deb *.AppImage *.exe > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" --title "Leme ${GITHUB_REF_NAME#v}" --generate-notes --latest \
            *.deb *.AppImage *.exe SHA256SUMS Packages Packages.gz Release InRelease Release.gpg leme-archive-keyring.gpg
