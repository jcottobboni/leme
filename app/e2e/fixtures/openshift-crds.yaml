# Minimal OpenShift API look-alikes for the Leme test cluster (kind ONLY).
# Real OpenShift serves these from its own API server; here they are schemaless CRDs so grids,
# topology and guards can be tested. Subresources such as instantiate do not exist on CRDs.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  scope: Namespaced
  names: {plural: routes, singular: route, kind: Route}
  versions:
    - name: v1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
