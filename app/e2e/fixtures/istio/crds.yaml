# Minimal stand-ins for the Istio CRDs the panel reads (no Istio controller is installed).
# The e2e spec creates each one only when absent and NEVER deletes them: other specs and agents
# share the kind cluster. Schemas preserve unknown fields; only v1 is served.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: peerauthentications.security.istio.io
  labels: {leme.dev/fixture: m5-istio}
spec:
  group: security.istio.io
  scope: Namespaced
  names: {kind: PeerAuthentication, listKind: PeerAuthenticationList, plural: peerauthentications, singular: peerauthentication, shortNames: [pa]}
  versions:
  - name: v1
    served: true
    storage: true
    schema: {openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}}
---
