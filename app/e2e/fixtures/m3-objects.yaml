# M3 test objects (kind ONLY): OpenShift look-alikes, an insecure workload, network policies and an RBAC risk.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: web, namespace: demo}
spec:
  host: web-demo.apps.kind.local
  to: {kind: Service, name: web}
  port: {targetPort: 80}
  tls: {termination: edge}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: frontend, namespace: demo}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: frontend, namespace: demo}
spec:
  strategy: {type: Docker}
  source: {type: Git, git: {uri: "https://example.com/frontend.git"}}
  output: {to: {kind: ImageStreamTag, name: "frontend:latest"}}
---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata: {name: frontend, namespace: demo}
spec:
  replicas: 1
  selector: {deploymentconfig: frontend}
  triggers:
    - type: ImageChange
      imageChangeParams: {automatic: true, containerNames: [nginx], from: {kind: ImageStreamTag, name: "frontend:latest"}}
  template:
    metadata: {labels: {deploymentconfig: frontend}}
    spec:
      containers: [{name: nginx, image: "nginx:1.27-alpine"}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: e2e-ci, namespace: demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: e2e-ci-cluster-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: e2e-ci, namespace: demo}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: insecure, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: insecure}}
  template:
    metadata: {labels: {app: insecure}}
    spec:
      hostNetwork: true
      volumes: [{name: host, hostPath: {path: /var/lib/kubelet}}]
      containers:
        - name: app
          image: busybox
          command: [sleep, "86400"]
          securityContext: {privileged: true}
          volumeMounts: [{name: host, mountPath: /host, readOnly: true}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: demo, labels: {app: client}}
spec:
  containers: [{name: c, image: "busybox:1.36", command: [sleep, "86400"]}]
